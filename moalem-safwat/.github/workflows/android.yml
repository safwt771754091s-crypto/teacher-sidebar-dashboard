name: Moalem Safwat Android APK
on:
  workflow_dispatch:
  push:
    branches: [feat/moalem-safwat-mvp]
    paths:
      - 'moalem-safwat/**'
permissions:
  contents: read
jobs:
  android-debug:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: moalem-safwat
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - run: npm install
      - run: npm run build
      - run: npx cap add android
      - run: npx cap sync android
      - name: Build debug APK
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: moalem-safwat-debug-apk
          path: moalem-safwat/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14